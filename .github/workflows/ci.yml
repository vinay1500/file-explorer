name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No virtualenv, bytecode or dependencies committed
        run: |
          # The previous repository carried 1,950 virtualenv files. Never again.
          bad=$(git ls-files | grep -E '(^|/)(site-packages|node_modules|__pycache__|\.venv|venv)/|\.pyc$' || true)
          if [ -n "$bad" ]; then
            echo "::error::build artefacts are committed"
            echo "$bad" | head -20
            exit 1
          fi
          echo "  clean"

      - name: No .env committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::an env file is committed: $bad"
            exit 1
          fi
          test -f .env.example || { echo "::error::.env.example is missing"; exit 1; }
          echo "  clean, and .env.example is present"

      - name: No credentials
        run: |
          # Narrow on purpose: these prefixes have no legitimate use in this repo,
          # so they cannot produce a false positive.
          bad=$(git grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' -- . || true)
          if [ -n "$bad" ]; then
            echo "::error::something that looks like a credential is committed"
            exit 1
          fi
          echo "  clean"

      - name: No unedited placeholders
        run: |
          # The old frontend README shipped "Material-UI (or any other UI library
          # you're using)". That is the failure this check exists to prevent.
          # This workflow is excluded because the patterns themselves live here.
          bad=$(git grep -nE '\[(VALUE|VALUES|PROJECT_NAME|DESCRIPTION|YOUR_|TODO_|PLACEHOLDER)[A-Z_0-9]*\]|lorem ipsum|or any other .* you.?re using' \
                -- '*.md' '*.yml' '*.yaml' '*.json' ':(exclude).github/workflows/*' || true)
          if [ -n "$bad" ]; then
            echo "::error::unedited placeholder text found"
            echo "$bad"
            exit 1
          fi
          echo "  clean"

      - name: docker-compose.yml is valid
        run: |
          docker compose -f docker-compose.yml config --quiet
          echo "  valid"

  # Runs the migration against a real PostgreSQL and then asserts the schema is
  # what the invariants need. A migration that applies cleanly but produces the
  # wrong indexes is the failure this catches.
  migrations:
    name: migrations and schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fileexplorer
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: file_explorer
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fileexplorer -d file_explorer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://fileexplorer:localdev@localhost:5432/file_explorer
      FLASK_APP: file_explorer.app:create_app
      PGHOST: localhost
      PGUSER: fileexplorer
      PGPASSWORD: localdev
      PGDATABASE: file_explorer

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint and type check
        run: |
          ruff check .
          ruff format --diff .
          mypy

      - name: Apply migrations
        run: flask db upgrade

      - name: Migrations are reversible
        run: |
          # A downgrade nobody runs is a downgrade that does not work.
          flask db downgrade base
          flask db upgrade

      - name: Schema matches the invariants
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "
            SELECT string_agg(indexname, ',' ORDER BY indexname)
            FROM pg_indexes WHERE tablename = 'nodes';" > /tmp/idx
          cat /tmp/idx | sed 's/^/  indexes: /'
          # Whole-field match. grep -q on a substring would accept
          # ck_nodes_ck_nodes_name_not_blank as ck_nodes_name_not_blank,
          # which is how a doubled prefix slipped through once already.
          for ix in ix_nodes_owner_parent uq_nodes_parent_name uq_nodes_root_name pk_nodes; do
            grep -qE "(^|,)$ix(,|$)" /tmp/idx || { echo "::error::missing index $ix"; exit 1; }
          done

          psql -v ON_ERROR_STOP=1 -tAc "
            SELECT string_agg(conname, ',' ORDER BY conname)
            FROM pg_constraint WHERE conrelid = 'nodes'::regclass;" > /tmp/con
          cat /tmp/con | sed 's/^/  constraints: /'
          for c in ck_nodes_not_own_parent ck_nodes_name_not_blank fk_nodes_parent_id \
                   fk_nodes_owner_id fk_nodes_parent_same_owner uq_nodes_id_owner; do
            grep -qE "(^|,)$c(,|$)" /tmp/con || { echo "::error::missing constraint $c"; exit 1; }
          done

          # I3 depends on this being CASCADE, not SET NULL or NO ACTION.
          act=$(psql -tAc "
            SELECT confdeltype FROM pg_constraint WHERE conname = 'fk_nodes_parent_id';")
          [ "$act" = "c" ] || { echo "::error::parent_id delete action is '$act', expected 'c' (cascade)"; exit 1; }
          echo "  parent_id ON DELETE CASCADE confirmed"

      - name: The constraints actually bite
        run: |
          # Each guard is tested by trying to violate it. A constraint that
          # exists but does not fire is worse than none, because it is trusted.
          psql -v ON_ERROR_STOP=1 -c "
            INSERT INTO users (id, email) VALUES (1, 'a@example.com');
            INSERT INTO nodes (id, owner_id, parent_id, name, type)
              VALUES (1, 1, NULL, 'docs', 'folder');" >/dev/null

          fail() { echo "::error::$1"; exit 1; }
          rejected() { ! psql -v ON_ERROR_STOP=1 -c "$1" >/dev/null 2>&1; }

          rejected "UPDATE nodes SET parent_id = 1 WHERE id = 1;" \
            || fail "I8: a node was allowed to be its own parent"
          echo "  I8 self-parent rejected"

          rejected "INSERT INTO nodes (id, owner_id, parent_id, name, type)
                    VALUES (2, 1, NULL, 'docs', 'folder');" \
            || fail "I2: a duplicate root name was accepted"
          echo "  I2 duplicate root name rejected"

          rejected "INSERT INTO nodes (id, owner_id, parent_id, name, type)
                    VALUES (3, 1, NULL, '   ', 'folder');" \
            || fail "whitespace-only name was accepted"
          echo "  blank name rejected"

          rejected "INSERT INTO users (id, email) VALUES (2, 'A@EXAMPLE.COM');" \
            || fail "email uniqueness is case-sensitive"
          echo "  case-insensitive email uniqueness confirmed"

          # G-02: btrim(name) with one argument trims SPACES only, so a tab
          # survives it. Red until the constraint is widened.
          rejected "INSERT INTO nodes (id, owner_id, parent_id, name, type)
                    VALUES (5, 1, NULL, E'\\t', 'folder');" \
            || fail "G-02: a tab-only name was accepted"
          echo "  G-02 tab-only name rejected"

          # G-01: I6 has no database backstop. The foreign key constrains the
          # id and nothing else, so a node can be attached under a parent
          # belonging to a different user -- after which the victim deleting
          # their folder cascades into the attacker's subtree. Red until the
          # composite foreign key lands.
          psql -v ON_ERROR_STOP=1 -c "
            INSERT INTO users (id, email) VALUES (2, 'b@example.com');
            INSERT INTO nodes (id, owner_id, parent_id, name, type)
              VALUES (6, 2, NULL, 'bob-root', 'folder');" >/dev/null
          rejected "INSERT INTO nodes (id, owner_id, parent_id, name, type)
                    VALUES (7, 1, 6, 'stolen', 'folder');" \
            || fail "G-01: a node was attached under another user's parent"
          echo "  G-01 cross-owner attach rejected"
          psql -c "DELETE FROM nodes WHERE id IN (6,7); DELETE FROM users WHERE id = 2;" >/dev/null

          # I3: deleting the parent must take the child with it.
          psql -v ON_ERROR_STOP=1 -c "
            INSERT INTO nodes (id, owner_id, parent_id, name, type)
              VALUES (4, 1, 1, 'child', 'file');
            DELETE FROM nodes WHERE id = 1;" >/dev/null
          left=$(psql -tAc "SELECT count(*) FROM nodes;")
          [ "$left" = "0" ] || fail "I3: cascade left $left row(s) behind"
          echo "  I3 cascade delete confirmed"

  # The suite that matters. Real PostgreSQL, because every invariant here is
  # enforced by something only a real database does -- cascades, partial unique
  # indexes, recursive CTEs, row locks. A suite that passes on SQLite has
  # tested a different program.
  tests:
    name: tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fileexplorer
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: file_explorer_test
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fileexplorer -d file_explorer_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://fileexplorer:localdev@localhost:5432/file_explorer_test
      FLASK_APP: file_explorer.app:create_app

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Invariants
        run: pytest tests/test_tree_invariants.py -v

      - name: Concurrency
        # Two real connections interleaved. Timeout kept tight: these tests
        # assert that one side BLOCKS, so a hang is a failure, not patience.
        timeout-minutes: 3
        run: pytest tests/test_concurrency.py -v

      - name: Every test is marked
        run: |
          # --strict-markers catches an unregistered mark. This catches the
          # opposite: a test that quietly carries no mark at all and so is
          # never selected by a filtered run.
          unmarked=$(pytest --collect-only -q -m "not invariant and not concurrency" 2>/dev/null \
                     | grep -cE '^tests/' || true)
          echo "  unmarked tests: $unmarked"
