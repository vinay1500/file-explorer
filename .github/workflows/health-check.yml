name: health check

# Twice a day, at the hours someone is actually around to act on a failure.
# GitHub cron is UTC: 05:30 and 09:00 UTC are 11:00 and 14:30 India time.
#
# Deliberately NOT every ten minutes. An earlier plan pinged frequently to keep
# a free instance warm; that was dropped. GitHub's scheduled workflows are
# best-effort and are delayed or skipped under load, so a strategy that needs a
# cron to fire inside every fifteen-minute window all day rests on a guarantee
# that does not exist. This job is monitoring, not warming.
on:
  schedule:
    - cron: "30 5 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The probe and the browser must point at the same service. They are
      # configured in two different places -- a repository variable and a
      # committed file -- and nothing connected them, so the probe could have
      # been green against a service the frontend never calls. Render appends a
      # random suffix when a subdomain is taken, which is exactly the kind of
      # difference nobody notices by eye.
      # Resolve the host to probe, and FAIL when it cannot be resolved.
      #
      # This step used to `exit 0` when `API_URL` was unset. So did the probe
      # below it, which meant the whole workflow was green whenever the
      # repository variable was absent, renamed, or scoped elsewhere -- and a
      # repository variable is exactly the kind of out-of-tree configuration
      # that disappears without a commit. A check that passes because it did
      # nothing is the failure this workflow exists to catch, one level up,
      # and chapter 7 of the book declares that failure closed.
      #
      # `vercel.json` is committed and names the same host, so there is a
      # fallback with no secret in it. If both are missing the job goes red,
      # which is the honest answer to "is anything being watched?".
      - name: Resolve the host to probe
        id: host
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          rewrite=$(grep -o '"destination": "https://[^/"]*' vercel.json | sed 's|.*//||')
          probe=${API_URL#http://}
          probe=${probe#https://}
          probe=${probe%%/*}

          if [ -z "$probe" ] && [ -z "$rewrite" ]; then
            echo "::error::neither the API_URL variable nor vercel.json names a host to probe"
            exit 1
          fi

          if [ -z "$probe" ]; then
            echo "::warning::API_URL is not set; falling back to the host committed in vercel.json"
            probe="$rewrite"
          elif [ "$probe" != "$rewrite" ]; then
            echo "::error::API_URL names '$probe' and vercel.json rewrites to '$rewrite'."
            echo "The probe and the browser are pointed at different services."
            exit 1
          else
            echo "  both name $probe"
          fi

          echo "url=https://$probe" >> "$GITHUB_OUTPUT"

      - name: Probe the API's readiness endpoint
        env:
          API_URL: ${{ steps.host.outputs.url }}
        run: |
          # --max-time 120 because a free instance can take most of a minute to
          # wake. A timeout here is a real failure, not a false alarm.
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 120 \
                 "$API_URL/api/v1/health" || echo "000")

          echo "  HTTP $code"
          head -c 300 /tmp/body | sed 's/^/  /'

          if [ "$code" != "200" ]; then
            echo "::error::health check returned $code - the API cannot reach its database"
            exit 1
          fi
          echo "  healthy"
