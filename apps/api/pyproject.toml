[project]
name = "file-explorer-api"
version = "0.1.0"
description = "Hierarchical folder manager API"
requires-python = ">=3.11"

# Minimums rather than exact pins while the shape is still settling. An
# exact lock lands at M4, generated from a green CI run so it reflects a
# combination that is known to work rather than one that looked right.
dependencies = [
    "Flask>=3.1",
    "Flask-SQLAlchemy>=3.1",
    "SQLAlchemy>=2.0",
    "Flask-Migrate>=4.0",
    # psycopg 3, which is what a bare postgresql:// URL resolves to in
    # SQLAlchemy 2.x. psycopg2 is in maintenance; this is the current driver.
    "psycopg[binary]>=3.2",
    # D-03: Flask with flask-smorest and marshmallow rather than FastAPI.
    # smorest gives the OpenAPI document and the blueprint/response decorators;
    # marshmallow does the validation. Both are the ecosystem's defaults here,
    # which matters more than either being the best in isolation.
    "flask-smorest>=0.45",
    "marshmallow>=3.21",
    # Rate limiting. In-memory by default, which is per-process and therefore
    # wrong across workers -- see the comment where it is configured.
    "Flask-Limiter>=3.8",
    # Password hashing. argon2id, at OWASP's minimum recommended configuration
    # rather than the library's defaults -- see `passwords.py` for why the
    # defaults do not fit a 512 MB shared instance.
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on an unregistered mark rather than silently skipping.
addopts = "-q --strict-markers"
markers = [
    "invariant: exercises one of the numbered invariants in docs/ARCHITECTURE.md",
    "concurrency: needs two real database connections",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF001 flags characters confusable with ASCII -- Arabic alef for "l", heh for
# "o" and so on. That is a good rule for ordinary code and a guaranteed false
# positive in the one file whose subject is non-ASCII names: its test data is
# Persian, Devanagari, Hebrew and CJK on purpose. Scoped to this file rather
# than allow-listed globally, so the rule keeps working everywhere else.
"tests/test_names_and_limits.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
packages = ["file_explorer"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
# Not strict yet - raised progressively rather than silenced with ignores.
disallow_untyped_defs = false

# These ship no type information. Listed one by one rather than with a blanket
# ignore_missing_imports, so a genuinely missing import still fails the build.
[[tool.mypy.overrides]]
module = ["flask_migrate.*", "flask_smorest.*", "flask_limiter.*", "apispec.*"]
ignore_missing_imports = true
